interface:
  display_name: "Generate Client Ad Video"
  short_description: "Build versioned client proposals and one locked H3 task"
  default_prompt: "Use $generate-client-ad-video to delegate a versioned client proposal package with five scripts, dimensions, and one aggregate keyframe. Apply client feedback as new immutable versions, then lock the confirmed package and create one H3 task. Keep this conversation orchestration-only."
dependencies:
  tools:
    - type: "mcp"
      value: "minimax_h3_console"
      description: "Upload the approved keyframe and submit or monitor MiniMax H3 video tasks"
policy:
  allow_implicit_invocation: true
