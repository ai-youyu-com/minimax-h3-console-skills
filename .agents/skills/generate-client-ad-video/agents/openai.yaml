interface:
  display_name: "Generate Client Ad Video"
  short_description: "Orchestrate child agents for five scripts, keyframes, and one video"
  default_prompt: "Use $generate-client-ad-video to delegate five script options and matching keyframes to child agents, then let me choose one video to submit. Keep this conversation orchestration-only."
dependencies:
  tools:
    - type: "mcp"
      value: "minimax_h3_console"
      description: "Upload the approved keyframe and submit or monitor MiniMax H3 video tasks"
policy:
  allow_implicit_invocation: true
